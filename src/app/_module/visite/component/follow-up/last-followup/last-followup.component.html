<mat-accordion>
    <mat-expansion-panel>
        <!--expanded-->
        <mat-expansion-panel-header>
            <mat-panel-title color="primary" class="accordionTitle">
                Ultimo Follow up inserito
            </mat-panel-title>
        </mat-expansion-panel-header>
        <ng-template matExpansionPanelContent>
            <form [formGroup]="formLastFollowUp" autocomplete="off">

                <div fxLayout="row wrap" fxLayout.lt-sm="column" fxLayoutGap="5%" fxLayoutGap.lt-md="0px">
                    <mat-form-field class="full-width" fxFlex="30">
                        <mat-label>Data registrazione</mat-label>
                        <input matInput type="text" [matDatepicker]="dataLastFollowupPicker" readonly (focus)="dataLastFollowupPicker.open()" (dateChange)="searchFollowup($event.value)" [max]="appGen.today" formControlName="dataFollowup" autocomplete="off">
                        <mat-datepicker-toggle matSuffix [for]="dataLastFollowupPicker">
                        </mat-datepicker-toggle>
                        <mat-datepicker touchUi #dataLastFollowupPicker></mat-datepicker>
                    </mat-form-field>
                </div>
                <div class="input-row" fxLayout="row wrap" fxLayout.lt-sm="column" fxLayoutGap="5%" fxLayoutGap.lt-md="0px">
                    <mat-form-field class="full-width" fxFlex="30" appearance="none">
                        <mat-label>Kcal</mat-label>
                        <input type="text" matInput readonly formControlName="kcal" autocomplete="off">
                    </mat-form-field>
                    <mat-form-field class="full-width" fxFlex="30" appearance="none">
                        <mat-label>Proteine</mat-label>
                        <input type="text" matInput readonly formControlName="proteine" autocomplete="off">
                        <span class="suffix" matSuffix>g/die</span>
                    </mat-form-field>
                    <mat-form-field class="full-width" fxFlex="30" appearance="none">
                        <mat-label>Azoto</mat-label>
                        <input type="text" matInput readonly formControlName="azoto" autocomplete="off">
                        <span class="suffix" matSuffix>g/die</span>
                    </mat-form-field>
                </div>
                <div class="input-row" fxLayout="row wrap" fxLayout.lt-sm="column" fxLayoutGap="5%" fxLayoutGap.lt-md="0px">

                    <mat-form-field class="full-width" fxFlex="30" appearance="none">
                        <mat-label>Apporto idrico</mat-label>
                        <input type="text" matInput readonly formControlName="apportoIdrico" autocomplete="off">
                    </mat-form-field>
                    <mat-form-field class="full-width" fxFlex="30" appearance="none">
                        <mat-label>Peso attuale</mat-label>
                        <input type="text" matInput readonly formControlName="peso" autocomplete="off">
                    </mat-form-field>
                    <mat-form-field class="full-width" fxFlex="30" appearance="none">
                        <mat-label>Velocità di somministrazione
                            <mat-hint>ml/ora</mat-hint>
                        </mat-label>
                        <input type="text" matInput readonly formControlName="velocitaSomministrazione" autocomplete="off">
                    </mat-form-field>
                </div>

            </form>
        </ng-template>


    </mat-expansion-panel>
</mat-accordion>
