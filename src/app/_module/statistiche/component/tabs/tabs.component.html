<mat-tab-group>

    <mat-tab *ngFor="let item of tabsWidgetsStats" [label]="item.descrizione">

        <div fxLayout="row wrap" FxLayoutGap="20px">
            <div *ngFor="let widget of item.widgets;let i= index">
                <app-widget [widget]="widget" fxLayoutAlign="space-around center"></app-widget>

            </div>
        </div>


    </mat-tab>
</mat-tab-group>
