<div class="backBtn">
    <button (click)="goToOspedali()">
        <mat-icon>keyboard_arrow_left</mat-icon>
        <span>Ospedali</span>
    </button>
</div>

<mat-card class="linfaCard">

    <div class="container">
        <mat-card-content>


        <h3 class="title">{{title}}</h3>

        <div class="filtri">
            <mat-form-field class="full-width" fxflex>
                <mat-label>Cerca</mat-label>
                <input matInput type="text" (keyup)="applyFilter($event)" #input>
            </mat-form-field>
        </div>

        <div class="cntrBtnRow" fxLayout="row" fxLayoutAlign="end" fxLayout.lt-sm="column" fxLayoutGap.lt-md="0px">
            <button mat-raised-button color="primary" class="btnTopCard" matTooltipPosition="after"
                (click)="addReparto()">
                <mat-icon>add</mat-icon>
                Nuovo reparto
            </button>
        </div>

        <mat-table [dataSource]="dataSource" multiTemplateDataRows id="table">


            <ng-container matColumnDef="descrizione">
                <mat-header-cell *matHeaderCellDef>Descrizione</mat-header-cell>
                <mat-cell *matCellDef="let element">{{element.descrizione}}</mat-cell>
            </ng-container>

            <ng-container matColumnDef="centroCosto">
                <mat-header-cell *matHeaderCellDef>Centro di costo</mat-header-cell>
                <mat-cell *matCellDef="let element">{{element.centroCosto}}</mat-cell>
            </ng-container>


            <ng-container matColumnDef="button">
                <mat-header-cell *matHeaderCellDef></mat-header-cell>
                <mat-cell *matCellDef="let element" class="buttons">

                    <mat-icon class="material-icons-outlined" matTooltip="Modifica" color="black" style="margin: 12px;"
                        (click)="editReparto(element)">edit</mat-icon>

                    <mat-icon class="material-icons-outlined" matTooltip="Elimina" color="warn"
                        (click)="deleteReparto(element)">delete_outline</mat-icon>

                </mat-cell>
            </ng-container>

            <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
            <mat-row class="caselle" *matRowDef="let row; columns: displayedColumns;"></mat-row>
        </mat-table>
        <mat-paginator class="paginator" [pageSizeOptions]="[10, 15, 20]" showFirstLastButtons>
        </mat-paginator>
        </mat-card-content>
    </div>
</mat-card>
