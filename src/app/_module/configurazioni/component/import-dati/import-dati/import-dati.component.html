<mat-card>
    <h3 class="title">Import dati</h3>

        <p>
            Importa i dati delle precedenti configurazioni
        </p>
    

        <mat-form-field style="width: 100%; padding: 4px;">
            <mat-label>Filter</mat-label>
            <input matInput [formControl]="filtroConfigurazioni">
          </mat-form-field>

    <div *ngIf="dataSource.data.length > 0">
        <mat-table [dataSource]="dataSource" multiTemplateDataRows>
            <ng-container matColumnDef="nomeTabella">
                <mat-header-cell *matHeaderCellDef>Tabella</mat-header-cell>
                <mat-cell *matCellDef="let element">{{element.nomeTabella}}</mat-cell>
            </ng-container>
    
            <ng-container matColumnDef="button">
                <mat-header-cell *matHeaderCellDef>
                    <mat-checkbox
                    (change)="selectAll()"
                    *ngIf="!allConfigSelected"
                    color="primary">
                        Seleziona tutti
                    </mat-checkbox>
        
                    <mat-checkbox
                    (change)="selectAll()"
                    *ngIf="allConfigSelected"
                    checked="true"
                    color="primary">
                        Deseleziona tutti
                    </mat-checkbox>
                </mat-header-cell>
                <mat-cell *matCellDef="let element">
                    <mat-checkbox
                    [checked]="element.check === true"
                    (change)="statusConfigCheck(element)"
                    class="custom-frame"
                    color="primary">
                    </mat-checkbox>
                </mat-cell>
            </ng-container>
    
            <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
            <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
        </mat-table>
        <mat-paginator [pageSizeOptions]="[10, 15, 20]" showFirstLastButtons [pageSize]="10">
        </mat-paginator>
    </div>

        <div class="cntrBtnRow" fxLayout="row" fxLayoutAlign="end" fxLayout.lt-sm="column" fxLayoutGap="2%"
        fxLayoutGap.lt-sm="10px">
            <button mat-raised-button color="primary" (click)="importaDati()">
                <mat-icon>import_export</mat-icon>
                Importa configurazioni selezionate
            </button>
        </div>
</mat-card>
