<mat-card class="linfaCard">
  <h3 class="title">Note nutrizionali predefinite</h3>
  <form [formGroup]="formNote" autocomplete="off">

    <div fxLayout="row wrap" fxLayout.lt-sm="column" fxLayoutGap="5%" fxLayoutGap.lt-md="0px">
      <mat-form-field class="full-width" fxFlex="65">
        <mat-label>Lista note nutrizionali predefinite</mat-label>
        <mat-select matNativeControl formControlName="id"
          (selectionChange)="selectedConclusionePredefinita($event.value)">
          <mat-option></mat-option>
          <mat-option *ngFor="let conclusione of listaNotePredefinite" [value]="conclusione.id">
            {{conclusione.conclusione}}
          </mat-option>
        </mat-select>
      </mat-form-field>
      <mat-divider></mat-divider>
      <mat-form-field class="full-width" fxFlex>
        <mat-label>Nota</mat-label>
        <textarea matInput formControlName="conclusione" cdkTextareaAutosize cdkAutosizeMinRows="3" required
          cdkAutosizeMaxRows="5"></textarea>
      </mat-form-field>
    </div>
    <div class="cntrBtnRow" fxLayout="row" fxLayoutAlign="end" fxLayout.lt-sm="column" fxLayoutGap="2%"
      fxLayoutGap.lt-sm="10px">
      <button mat-raised-button color="warn" (click)="delete()"
        *ngIf="!this.appGen.isNullOrUndefined(this.formNote.get('id').value)">
        <mat-icon>delete</mat-icon>
        Elimina
      </button>




      <button mat-raised-button color="primary" (click)="onSubmit(false)"
        *ngIf="!this.appGen.isNullOrUndefined(this.formNote.get('id').value)">
        <mat-icon>save</mat-icon>
        Aggiorna
      </button>
      <button mat-raised-button color="primary" (click)="onSubmit(true)">
        <mat-icon>save</mat-icon>
        Inserisci nuova
      </button>
    </div>
  </form>
</mat-card>
