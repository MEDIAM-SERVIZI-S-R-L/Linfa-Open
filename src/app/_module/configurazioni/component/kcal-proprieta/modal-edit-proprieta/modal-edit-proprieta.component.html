<h1 mat-dialog-title>
  {{this.proprieta.proprieta}}
</h1>

<div mat-dialog-content>

  <div class="container">

    <form [formGroup]="form" autocomplete="off">

      <div fxLayout="row wrap" fxLayout.lt-sm="column" fxLayoutGap="5%" fxLayoutGap.lt-md="0px">

        <mat-form-field class="full-width" fxFlex="30">
          <mat-label>Kcal</mat-label>
          <input type="text" matInput formControlName="kcal" autocomplete="off">
        </mat-form-field>
        <mat-form-field class="full-width" fxFlex="30">
          <mat-label>Quantità</mat-label>
          <input type="text" matInput formControlName="quantita" autocomplete="off">
        </mat-form-field>
        <mat-checkbox color="primary" formControlName="abilitato" fxFlex="30">Abilitato</mat-checkbox>
      </div>

    </form>
  </div>

</div>


<div class="input-row cntrBtnRow" fxLayout="row wrap" fxLayout.lt-sm="column" fxLayoutAlign="end" fxLayoutGap="2%"
  fxLayoutGap.lt-md="10px">
  <button mat-raised-button color="warn" (click)="onDismiss()">Annulla</button>

  <button mat-raised-button color="primary" (click)="onSubmit()">
    <mat-icon>save</mat-icon>
    Salva
  </button>
</div>
