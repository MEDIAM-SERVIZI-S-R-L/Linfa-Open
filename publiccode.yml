    localisedName: Linfa Open
    shortDescription: Frontend applicativo per i reparti ospedalieri di nutrizione,
      realizzato in Angular 12 + Material.
    longDescription: >-
      Frontend applicativo per i reparti ospedalieri di nutrizione, realizzato
      in Angular 12 + Material.

      L’interfaccia mette a disposizione dashboard operative con l’elenco delle
      visite da eseguire, la pianificazione degli appuntamenti e la gestione
      dettagliata della visita nutrizionale (anamnesi, parametri clinici, piano
      alimentare e note).
    documentation: https://github.com/MEDIAM-SERVIZI-S-R-L/Linfa-Open
